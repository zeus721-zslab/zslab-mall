spring:
  application:
    name: zslab-mall
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # DB_HOST·DB_PORT는 docker-compose.mall.yml에서 zslab_mariadb·3306으로 박제 주입 (로컬·운영 동일)
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # Track 104-1 D-215(invariants P5 "락 이후의 판정은 최신 커밋을 본다"): 앱 전체 READ COMMITTED. MariaDB 기본 REPEATABLE READ는
      # 트랜잭션 첫 읽기 스냅샷을 끝까지 쓰므로, 주문 락을 기다린 쪽이 락 뒤 비잠금 읽기로 앞 트랜잭션이 커밋한 품목을 못 보고 옛 상태로
      # 재계산한다. 모든 프로필·테스트가 이 설정을 공유한다(datasource override 없음). 운영 binlog 꺼짐 확인(2026-09-23) — RC와
      # 충돌하는 STATEMENT binlog 조건 없음.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # KST 통일(JVM·jdbc 동시 정렬·Track 69) — URL serverTimezone 미혼용
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      # Track 77 이미지 업로드: 파일당 10MB(UPLOAD_MAX_SIZE·매직 바이트 검증은 앱) · 요청당 최대 20장 + 멀티파트 오버헤드 여유 = 210MB.
      max-file-size: ${UPLOAD_MAX_SIZE:10485760}
      max-request-size: 220MB
  jackson:
    # D-49·§15: 응답 null 필드 제외(camelCase는 Jackson 기본). 날짜 UTC Z 포맷은 DTO 필드 @JsonFormat에서 처리.
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      # D-175·검수 5단계: @Scheduled 7건이 기본 1스레드에서 직렬 실행돼 한 배치 지연이 전체를 막던 구조 → 스케줄러 수 이상으로 분리.
      # Track 96-6 월 정산·등급 재산정 스케줄러 추가로 9건 → 10.
      # 단건 직렬화는 각 서비스의 행 락·조건부 UPDATE가 담당하므로 병렬 실행이 동시성 가정을 바꾸지 않는다.
      pool:
        size: 10
      thread-name-prefix: zslab-sched-

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.zslab.mall: DEBUG
  pattern:
    # §14·D-48: 모든 로그 라인에 요청 traceId 포함(TraceIdFilter가 MDC 주입·요청 외엔 공백)
    level: "%5p [%X{traceId:-}]"

jwt:
  # 로컬 개발용 더미 시크릿 — 운영은 JWT_SECRET env 주입 필수(application-prod.yml에서 기본값 제거). HS256 최소 32바이트.
  secret: ${JWT_SECRET:local-dev-dummy-secret-please-override-min-32-bytes-long}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

admin:
  bootstrap:
    # 최초 SUPER_ADMIN 공급 자격(SuperAdminBootstrapRunner·Track 38). SUPER_ADMIN 부재 시에만 소비된다 — 빈 기본값으로
    # context는 로드되고, 생성 경로에서 blank면 기동 실패(Fail Fast). 이미 SUPER_ADMIN 존재 시 미참조(skip)라 jwt.secret과
    # 달리 prod에서도 기본값을 제거하지 않는다(제거 시 admin 존재 환경의 재기동까지 env를 강제하게 됨).
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

upload:
  # Track 77 이미지 업로드 저장 루트(컨테이너 내부 절대경로·docker-compose.mall.yml이 UPLOAD_PATH=/app/uploads로 고정 주입·볼륨 동일 경로).
  # 하위에 products/yyyy/MM/{ULID}.{ext}로 저장하며 GET /api/v1/files/** 가 같은 루트를 서빙한다.
  path: ${UPLOAD_PATH:/app/uploads}
  # D-230 이미지 총 픽셀 상한(헤더 판독·디코딩 전 거부). 한 변 8000px 상한은 코드 상수. 초과 시 파일별 IMAGE_TOO_LARGE(부분 성공 유지).
  max-image-pixels: 25000000
  # D-230 이미지당 디코딩 픽셀 버퍼 예산 — 디코더 작업 버퍼·메타데이터는 제외. 동시 디코딩 1개로 힙 여유를 확보
  # (가로×세로×밴드×샘플 바이트·헤더 단계 판정·16비트 등 비표준 래스터는 썸네일 변환 복사본 4B/px 가산)
  # 100MiB — 8비트 RGBA 5000×5000(1억 B)까지 통과, 16비트 RGBA 4000×4000(1.28억 B + 0.64억 B)은 거부. 초과 시 파일별 IMAGE_TOO_LARGE.
  max-decode-bytes: 104857600
  # D-230 앱 전역 동시 디코딩 수(공정 세마포어)와 대기 한도. 1개로 둔다 — progressive JPEG은 libjpeg가 힙 밖에 약 150MB(5000² 기준)를
  # 추가로 잡으므로, 최대 사용량을 힙 예산 100MiB + 힙 밖 150MB로 고정한다(힙 512m·컨테이너 1GiB 전제). 대기가 한도를 넘으면 요청 전체 503 UPLOAD_BUSY.
  max-concurrent-decodes: 1
  # D-230 파일 처리 입장 한도(처리 1 + 대기 4). 파일 바이트를 힙에 올리기 전에 대기 없이 판정하고 가득 차면 요청 전체 503 UPLOAD_BUSY.
  # 힙 상한(F = 파일당 최대 10MB, B = 디코딩 예산 100MiB): 평상시 5·F + B ≈ 150MB · 최악 피크 5·2F(헤더 판독 중 JPEG ICC 등 일시 사본)
  # + B + 썸네일 약 5MB ≈ 205MB. 힙 밖 progressive JPEG 약 150MB는 별도(디코딩 차례 1개라 동시에 하나).
  max-inflight-files: 5
  decode-wait-timeout: 30s

bank-account:
  # Track 89-F 셀러 정산계좌 AES-256-GCM 키(D-188·SLR-2). raw 32바이트를 Base64로 인코딩한 44자. 로컬 개발용 더미 — 운영은
  # BANK_ACCOUNT_ENCRYPTION_KEY env 주입 필수(application-prod.yml에서 기본값 제거·미주입 시 기동 실패). 형식 오류도 기동 실패(BankAccountEncryptionConfig).
  # 더미 키로 암호화된 로컬 데이터는 운영 키로 읽을 수 없다(환경 간 dump 이동 불가). 생성 명령은 .env.example 참조.
  encryption-key: ${BANK_ACCOUNT_ENCRYPTION_KEY:bG9jYWwtZGV2LWR1bW15LWJhbmstYWNjb3VudC1rZXk=}

zslab:
  # Track 97 D-209 외부 서비스 구현체 선택. mock = Mock 어댑터(기본·외부 호출 없음). mock 외 값은 해당 값으로 등록된 실 구현체가
  # 있어야 하며 없으면 주입 지점에서 기동 실패한다(조용히 Mock으로 되돌아가지 않음). 전환 절차는 docs/architecture-baseline/real-service-switch-guide.md.
  payment:
    gateway: ${PAYMENT_GATEWAY:mock}
  notification:
    sms-sender: ${SMS_SENDER:mock}
    email-sender: ${EMAIL_SENDER:mock}
  # Track 99 D-210 배송 조회·자동 배송완료. tracker는 위 3개와 같은 선택 장치이며(mock 외 값은 실 구현체 필수) mock-days는
  # Mock 어댑터가 "발송 후 며칠이면 배달 완료로 본다"로 쓰는 값이다(실 어댑터에서는 무시된다).
  # auto-complete.enabled=false면 자동 배송완료 스케줄러 빈이 생성되지 않는다(수동 배송완료 API는 영향 없음).
  delivery:
    tracker: ${DELIVERY_TRACKER:mock}
    # MockDeliveryTracker 전용. tracker가 스칼라라 그 아래 하위 키를 둘 수 없어(YAML 키 충돌) 형제 키로 뗀다.
    tracker-mock-days: ${MOCK_DELIVERY_DAYS:2}
    auto-complete:
      enabled: ${DELIVERY_AUTO_COMPLETE_ENABLED:true}
  # Track 104-2 D-216 불일치 점검 스케줄러(하루 1회·불일치 행만 기록·업무 데이터 무변경). false면 빈이 생성되지 않는다
  # (PG 통지 충돌·환불 완료 시점 기록은 이 스위치와 무관하게 동작).
  reconciliation:
    check:
      enabled: ${RECONCILIATION_CHECK_ENABLED:true}
  # D-230 데모 계정 보호. 쉼표 구분 이메일(대소문자 무시)은 비밀번호 변경·탈퇴·역할 해제·셀러 구성원 제외를 요청자와 무관하게 403으로 막는다.
  # compose가 기존 데모 계정 값 3개(ADMIN_BOOTSTRAP_EMAIL·NUXT_BUYER_DEMO_EMAIL·NUXT_SELLER_DEMO_EMAIL)를 이어 붙여 넘긴다. 비어 있으면 보호 없음.
  demo:
    protected-emails: ${DEMO_PROTECTED_EMAILS:}
    # true면 보호 계정 0개일 때 기동 실패(application-prod.yml만 true·fail-open 차단).
    require-protected-accounts: false

settlement:
  # Track 85 정산 설정. default-commission-rate = 플랫폼 기본 수수료율(basis-point·1000=10.00%)·셀러 개별율·카테고리율이 모두 없을 때
  # 적용(CommissionRateResolver). V30 백필 상수 1000과 같아야 한다. payout-offset-days = 지급예정일 = 정산 기간 말일 + N일.
  default-commission-rate: ${SETTLEMENT_DEFAULT_COMMISSION_RATE:1000}
  payout-offset-days: ${SETTLEMENT_PAYOUT_OFFSET_DAYS:20}
