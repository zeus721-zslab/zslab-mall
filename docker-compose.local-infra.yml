# 공유 인프라가 없는 환경 전용 로컬 DB — README "로컬 실행" 참조.
# 공유 인프라(zslab_mariadb가 이미 떠 있는 환경)에서는 쓰지 않는다: 같은 네트워크에 zslab_mariadb 이름이 둘이 되어 DB 연결 대상이 섞인다.
# Redis·Elasticsearch는 넣지 않는다 — 코드가 Redis를 읽지 않고, ES는 filebeat 로그 전송 대상일 뿐 기동에 필요 없다.
# 사용: docker compose -f docker-compose.local-infra.yml up -d --wait
name: zslab-mall-local-infra

services:
  # 서비스명이 곧 네트워크 안 호스트명이다 — docker-compose.mall.yml의 DB_HOST(zslab_mariadb)와 같아야 한다.
  zslab_mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    # 데모 시드(scripts/demo-seed/seed.py)를 호스트에서 실행하기 위한 공개. 127.0.0.1에만 묶어 외부에서는 접속할 수 없다.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - zslab_zslab_net

volumes:
  mariadb_data:

networks:
  zslab_zslab_net:
    external: true
